<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quick Reserve - Login</title>
  <style>
    * { 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%; 
      overflow: hidden; /* Removes scrollbars */
    }

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #fff;
    }

    .main-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      flex: 1;
      padding: 4rem 50px;
    }

    .left-section {
      width: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 10rem;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 100%;
      width: 100%;
    }

    .logo h1 {
      font-weight: 900;
      margin: 0;
    }

    .reserve {
      color: #ff7b00;
      font-weight: bold;
    }

    .right-section {
      width: 40vw;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0px 50px;
    }

    .login-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #fff;
      border: 2px solid black;
      padding: 4rem 70px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.30);
      border-radius: 30px;
      position: relative;
    }

    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      color: #333;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .back-button:hover {
      color: #ff7b00;
    }

    .login-box p {
      text-align: center;
      margin-bottom: 3rem;
      font-size: 3em;
      font-weight: 900;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 2px solid rgb(85, 83, 83);
      border-radius: 5px;
      background-color: #808080;
      opacity: 40%;
    }
    input::placeholder {
      color: white;
    }

    .forgot {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 0.9em;
    }

    .login-button {
      width: 100%;
      padding: 10px;
      background-color: #948B8A;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      margin-top: 25px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9em;
    }

    .signup a {
      text-decoration: underline;
      color: blue;
    }

    .bottom-sticker {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 65vw;
      height: 30vh;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .bottom-sticker img {
      height: 100%;
      width: 100%;
    }

    /* Error message styling */
    .error-message {
      color: red;
      font-weight: bold;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="main-content">
    <div class="left-section">
      <div class="logo">
        <img src="Assets/logo.png" alt="Quick Reserve Logo" />
      </div>
    </div>

    <div class="right-section">
      <div class="login-box">
        <a href="homepage.html" class="back-button">
          <i class="fas fa-arrow-left"></i>
        </a>
        <p>LOGIN</p>
        <form method="post" action="User/php/auth.php">
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <div class="forgot">
            <span></span>
            <a href="otp/resetpass.php" style="text-decoration: none;">Forgot password?</a>
          </div>
          <button type="submit" class="login-button">Log In</button>
        </form>
        <div class="signup">
          Don't have an account? <a href="User/php/signup.php">Sign up</a>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-sticker">
    <img src="Assets/sticker.png" alt="Pet Sticker" />
  </div>
  <!-- Modal Structure -->
<div id="errorModal" style="
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;">
  <div style="
    background-color: white;
    padding: 2rem;
    border-radius: 10px;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  ">
    <h2>Error</h2>
    <p id="errorMessage" style="margin-bottom: 1.5rem; color: red; font-weight: bold;"></p>
    <button onclick="closeModal()" style="
      padding: 10px 20px;
      background-color: #948B8A;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    ">Close</button>
  </div>
</div>

<script>
  // Function to close modal
  function closeModal() {
    document.getElementById('errorModal').style.display = 'none';
    // Optional: Remove error param from URL
    const url = new URL(window.location);
    url.searchParams.delete('error');
    window.history.replaceState({}, document.title, url.pathname);
  }

  // Show modal if error param exists
  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      document.getElementById('errorMessage').textContent = decodeURIComponent(error.replace(/\+/g, ' '));
      document.getElementById('errorModal').style.display = 'flex';
    }
  };
</script>

</body>
</html>
